<html>
  <head>
    <title>Site blocked!</title>
    <style>
      :root {
        font-family: sans-serif;
        font-size: 32px;
        line-height: 48px;
      }
      .holder {
        display: flex;
        align-items: center;
        justify-content: center;
        .left {
          height: 400px;
        }
      }
      .tiny {
        display: inline;
        height: 100px;
      }
      .chat-container {
        display: flex;
        justify-content: right;
        margin-top: 20px;
        .chat {
          font-size: 16px;
          line-height: 8px;
          background: #a040ff88;
          border-radius: 40px 40px 5px 40px;
          padding: 20px;
          height: max-content;
        }
      }
    </style>
  </head>
  <body>
    <div class="holder">
      <img class="left" src="./assets/art/kyoma_computer.png" />
      <div class="right">
        <strong>Uh oh! It looks like you clicked a bad link!</strong>
        <br />
        <em>Luckily I caught it and blocked it!</em>
        <br />
        <div class="chat-container">
          <div class="chat">You can go ahead and close this page</div>
          <img class="tiny" src="./assets/art/kyoma_float.png" />
        </div>
      </div>
    </div>
  </body>
</html>
